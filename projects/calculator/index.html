<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="calculator__header">
        <p class="eyebrow">Everyday math</p>
        <h1>Calculator</h1>
      </header>

      <section class="display" aria-live="polite">
        <div class="display__expression" id="expression">&nbsp;</div>
        <div class="display__value" id="display">0</div>
      </section>

      <section class="keypad" aria-label="Calculator keypad">
        <button class="key key--utility" data-action="clear" type="button">Clear</button>
        <button class="key key--utility" data-action="backspace" type="button" aria-label="Delete last digit">⌫</button>
        <button class="key key--operator" data-operation="divide" type="button">÷</button>
        <button class="key key--operator" data-operation="multiply" type="button">×</button>

        <button class="key" data-number="7" type="button">7</button>
        <button class="key" data-number="8" type="button">8</button>
        <button class="key" data-number="9" type="button">9</button>
        <button class="key key--operator" data-operation="subtract" type="button">−</button>

        <button class="key" data-number="4" type="button">4</button>
        <button class="key" data-number="5" type="button">5</button>
        <button class="key" data-number="6" type="button">6</button>
        <button class="key key--operator" data-operation="add" type="button">+</button>

        <button class="key" data-number="1" type="button">1</button>
        <button class="key" data-number="2" type="button">2</button>
        <button class="key" data-number="3" type="button">3</button>
        <button class="key key--equals" data-action="equals" type="button">=</button>

        <button class="key key--wide" data-number="0" type="button">0</button>
        <button class="key" data-action="decimal" type="button">.</button>
        <button class="key key--utility" data-action="toggle-sign" type="button">+/−</button>
      </section>

      <p class="keyboard-hint">Tip: You can also use your keyboard.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
